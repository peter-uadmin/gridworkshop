#run with --extra-vars
---
- name: Delete NetApp StorageGRID tenant account
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - global_vars.yml

  vars_prompt:
    - name: tenant_name
      prompt: "enter tenant name"
      default: "default"
      private: false

  roles:
    - grid_auth

  tasks:
    - name: delete
      netapp.storagegrid.na_sg_grid_account:
        api_url: "{{ grid_endpoint }}"
        auth_token: "{{ bearer_token }}"
        validate_certs: false
        state: present
        name: "{{ tenant_name }}"
        protocol: "s3"
        use_own_identity_source: false
        allow_platform_services: false
