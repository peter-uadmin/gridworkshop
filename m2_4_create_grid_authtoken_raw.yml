###########################
#This play does not use a module but RAW API
#The body format is json
#Also: this play uses validate_certs: true
#So you need to have a certificate: 
###########################

---
- name: Get Grid Admin Auth Token
  hosts: localhost
  gather_facts: no
  collections:
    - netapp.storagegrid
#
#define endpoint, user and pass
#
  vars:
    grid_endpoint: "https://192.168.4.230:443"
    grid_username: "root"
    grid_password: "br@@mspun111"
#
#connect to endpoint and use /api/v3/authorize
#
  tasks:
    - name: Get Grid Authorization Token
      uri:
        url: "{{ grid_endpoint }}/api/v3/authorize"
        method: POST
        body: '{"username": "{{ grid_username }}", 
                "password": "{{ grid_password }}"}'
        body_format: json
        validate_certs: true 
        ca_path: /root/gridworkshop/grid_admin.pem
        status_code: [200]
      register: auth
#
#the authtoken can be processes as auth.json.data (variable)
#
    - name: Display Grid Admin Auth Token
      ansible.builtin.debug:
        msg: "Grid Admin Auth Token: {{ auth.json.data }}"
