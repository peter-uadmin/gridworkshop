#This role sets the bearer_token for grid_authorization
---
- name: Get Grid  Authorization Token
  uri:
    url: "{{ grid_endpoint }}/api/v3/authorize"
    method: POST
    body_format: json
    body:
      accountId: "{{ tenant_id }}"
      username: "{{ tenant_username }}"
      password: "{{ tenant_password }}"
    status_code: 200
    validate_certs: false
  register: auth

