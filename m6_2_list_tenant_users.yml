---
- name: List StorageGRID tenant users via API
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    grid_endpoint: "https://192.168.0.80:443"

  vars_prompt:
    - name: tenant_id
      prompt: "Enter tenant ID"
      default: "18815655567777745228"
      private: false
    - name: tenant_root_user
      prompt: "Enter tenant root username"
      private: false
      default: "root"
    - name: tenant_root_pass
      prompt: "Enter tenant root password"
      private: true

  tasks:
    - name: Get tenant auth token
      uri:
        url: "{{ grid_endpoint }}/api/v3/authorize"
        method: POST
        body_format: json
        body:
          accountId: "{{ tenant_id }}"
          username: "{{ tenant_root_user }}"
          password: "{{ tenant_root_pass }}"
        validate_certs: false
        status_code: [200]
      register: auth

    - name: Fail if token not found
      fail:
        msg: "Failed to get auth token: {{ auth.json }}"
      when: auth.json.data is not defined

    - name: List tenant users (GET /api/v3/org/users)
      uri:
        url: "{{ grid_endpoint }}/api/v3/org/users"
        method: GET
        headers:
          Authorization: "Bearer {{ auth.json.data }}"
          Accept: "application/json"
        validate_certs: false
        status_code: [200]
      register: users

    - name: Show username and id for each user
      debug:
        msg: "user: {{ item.uniqueName }}, id: {{ item.id }}"
      loop: "{{ users.json.data }}"

