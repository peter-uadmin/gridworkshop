---
- name: List StorageGRID tenant users via Tenant API
  hosts: localhost
  gather_facts: no

  vars:
    tenant_endpoint: "https://192.168.4.230:443"

  vars_prompt:
    - name: tenant_id
      prompt: "Enter tenant ID"
      default: "06720005734697258898"
      private: no

    - name: tenant_root_user
      prompt: "Enter tenant root username"
      default: "root"
      private: no

    - name: tenant_root_pass
      prompt: "Enter tenant root password"
      private: yes

  tasks:
    - name: Get tenant auth token
      uri:
        url: "{{ tenant_endpoint }}/api/v3/authorize"
        method: POST
        body_format: json
        body:
          username: "{{ tenant_root_user }}"
          password: "{{ tenant_root_pass }}"
          accountId: "{{ tenant_id }}"
        validate_certs: false
        status_code: [200]
      register: auth

    - name: Fail if token not found
      fail:
        msg: "Failed to get auth token: {{ auth.json }}"
      when: auth.json.data is not defined

    - name: List tenant users (GET /api/v3/org/users)
      uri:
        url: "{{ tenant_endpoint }}/api/v3/org/users"
        method: GET
        headers:
          Authorization: "Bearer {{ auth.json.data }}"
        validate_certs: false
        status_code: [200]
      register: users

    - name: Show users JSON
      debug:
        var: users.json

