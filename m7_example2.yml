---
- name: Manage ILM rule
  hosts: localhost
  gather_facts: false
  collections:
    - netapp.storagegrid

  vars_files:
    - vars.yml

  tasks:
    - name: Create ILM rule "demo-2-copies"
      na_sg_grid_ilm_rule:
        api_url: "{{ grid_endpoint }}"
        username: "{{ grid_username }}"
        password: "{{ grid_password }}"
        validate_certs: false
        state: present
        name: "demo-2-copies"
        reference_time: "ingestTime"
        ingest_behavior: "balanced"
        filters: []          # apply to all objects
        placements:
          - retention:
              after: 0       # from day 0
            replicated:
              - copies: 2
                poolId: "p10771105546308032398"

