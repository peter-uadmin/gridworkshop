---
- name: Create StorageGRID tenant group with full S3 access
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - netapp.storagegrid

  vars_files:
    - global_vars.yml

  vars_prompt:
    - name: tenant_id
      default: 18815655567777745228 
      prompt: tenant_id
      private: false
    - name: sg_group_display_name
      prompt: group name
      default: ------
      private: false
    - name: sg_group_unique_name 
      prompt: unique name (group/group name)
      default: ------
      private: false
    - name: tenant_username
      prompt: tenant username
      default: root
      private: false
    - name: tenant_password
      prompt: tenant password
      default: Netapp1!
      private: true

  roles:
    - tenant_auth

  tasks:
    - name: Ensure full-S3-access group exists
      na_sg_org_group:
        api_url: "{{ grid_endpoint }}"
        auth_token: "{{ bearer_token }}"
        validate_certs: false

        state: present
        display_name: "{{ sg_group_display_name }}"
        unique_name: "{{ sg_group_unique_name }}"

        # Management permissions for the tenant UI/API
        management_policy:
          manage_all_containers: true
          manage_endpoints: true
          manage_own_s3_credentials: true
          root_access: true
          s3_console: true        # maps to manageOwnContainerObjects in API [web:5]
          view_all_containers: true

        # Full S3 access to all buckets in this tenant
        # NOTE: module expects valid JSON; give it as a JSON string
        s3_policy: >
          {"Statement":[{"Effect":"Allow","Action":"s3:*","Resource":"arn:aws:s3:::*"}]}


