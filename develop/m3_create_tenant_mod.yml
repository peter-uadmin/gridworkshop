---
- name: Create StorageGRID tenant (minimal)
  connection: local
  hosts: localhost
  gather_facts: false

  vars_prompt:
    - name: grid_addr
      prompt: "Grid admin address"
      default: "192.168.4.230"
      private: no
    - name: grid_user
      prompt: "Grid admin username"
      default: "root"
      private: no
    - name: grid_pass
      prompt: "Grid admin password"
      default: "br@@mspun111"
      private: yes
    - name: tenant_name
      prompt: "Tenant name"
      private: no
    - name: tenant_root_pass
      prompt: "Tenant root password"
      default: "br@@mspun111"
      private: yes

  tasks:
    - name: Login to StorageGRID
      netapp.storagegrid.na_sg_grid_login:
        hostname: "{{ grid_addr }}"
        username: "{{ grid_user }}"
        password: "{{ grid_pass }}"
        validate_certs: false
      register: auth 

    - name: Inspect login result
      debug:
        var: auth 

    - name: Set grid token
      ansible.builtin.set_fact:
        grid_token: "{{ auth.na_sa_token }}"

    - name: create a tenant account
      netapp.storagegrid.na_sg_grid_tenant:
        api_url: "https://{{ grid_addr }}"
        auth_token: "{{grid_token }}"
        validate_certs: false
        state: present
        name: "{{ tenant_name }}"
        protocol: s3
        management: true
        #allow_compliance_mode: true #requires 11.9
        #max_retention_days: 365 #requireires 11.9 
        use_own_identity_source: false
        allow_platform_services: false
        tenant_password: "{{ tenant_root_pass }}"
        quota_size: 0

          #- name: Show tenant creation result
          #ansible.builtin.debug:
          #var: tenant.json
