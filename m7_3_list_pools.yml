---
- name: Create pool
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - netapp.storagegrid

  vars_files:
    - global_vars.yml

  tasks:
    - name: Get grid auth token
      ansible.builtin.uri:
        url: "{{ grid_endpoint }}/api/v3/authorize"
        method: POST
        body_format: json
        body:
          username: "{{ grid_username }}"
          password: "{{ grid_password }}"
          cookie: false
          csrfToken: false
        headers:
          Content-Type: "application/json"
        validate_certs: false
        status_code: 200
      register: auth

    - name: Set grid token
      ansible.builtin.set_fact:
        grid_token: "{{ auth.json.data }}"

    - name: Display auth token
      ansible.builtin.debug:
        msg:
          - "Full auth response: {{ auth.json }}"
          - "Token data: {{ auth.json.data }}"
          - "Just the token: {{ auth.json.data }}"

    - name: Get grid info (including ILM pools)
      na_sg_grid_info:
        api_url: "{{ grid_endpoint }}"
        auth_token: "{{ grid_token }}"
        validate_certs: false
      register: grid_info

    - name: Show ILM storage pools (concise)
      ansible.builtin.debug:
        msg: >-
          {{ item.id | default('N/A') }}
          | {{ item.name | default('N/A') }}
          | {{ item.description | default('N/A') }}
    - name: Show ILM storage pools (concise)
      ansible.builtin.debug:
        msg: >-
          {{ item.id | default('N/A') }}
          | {{ item.displayName | default('N/A') }}
          | {{ item.name | default('N/A') }}
      loop: "{{ grid_info.sg_info['grid/ilm-pools'].data | default([]) }}"

