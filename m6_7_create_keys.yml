---
- name: Create S3 access keys for a tenant user
  hosts: localhost
  connection: local
  gather_facts: false

  vars_prompt:
    - name: "tenant_id"
      prompt: "Enter tenant ID"
      default: "18815655567777745228"
      private: false
    - name: "tenant_username" 
      prompt: "Enter tenant_user"
      default: "root"
      private: false
    - name: "tenant_password"
      prompt: "Enter tenant user password"
      default: "Netapp1!"
      private: true

  vars_files:
    - global_vars.yml

  roles:
    - tenant_auth

  tasks:
    - name: List tenant users
      ansible.builtin.uri:
        url: "{{ grid_endpoint }}/api/v4/org/users"
        method: GET
        headers:
          Authorization: "Bearer {{ bearer_token }}"
          Content-Type: "application/json"
        validate_certs: false
        status_code: 200
      register: users
    - name: Show raw users JSON
      ansible.builtin.debug:
        var: users.json

    - name: Ask for target user ID
      ansible.builtin.pause:
        prompt: "Enter the user ID (UUID) for which to \
                 create S3 access keys (see list above)"
      register: target_user_input

    - name: Set target user ID fact
      ansible.builtin.set_fact:
        target_user_id: "{{ target_user_input.user_input }}"

    - name: Create S3 access keys for user
      ansible.builtin.uri:
        url: "{{ grid_endpoint }}/api/v4/org/users/\
              {{ target_user_id }}/s3-access-keys"
        method: POST
        body_format: json
        body: {}
        headers:
          Authorization: "Bearer {{ bearer_token }}"
          Content-Type: "application/json"
        validate_certs: false
        status_code: 201
      register: s3_keys

    - name: Display created S3 keys
      ansible.builtin.debug:
        msg:
          access_key: "{{ s3_keys.json.data.accessKey |\
                       default(s3_keys.json.accessKey) }}"
          secret_access_key: "{{ s3_keys.json.data.secretAccessKey |\
                              default(s3_keys.json.secretAccessKey) }}"
          raw_response: "{{ s3_keys.json }}"
