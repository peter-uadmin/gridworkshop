---
- name: Change StorageGRID tenant root password
  hosts: localhost
  gather_facts: false

  collections:
    - netapp.storagegrid

  vars_files:
    - global_vars.yml

  vars_prompt:
    - name: tenant_id
      prompt: Tenant id
      private: false
    - name: tenant_name
      prompt: Tenant name
      default: finance
    - name: tenant_pass
      prompt: Tenant password
      private: true

  roles:
    - grid_auth

  tasks:
    - name: Change tenant root password
      na_sg_grid_account:
        api_url: "{{ grid_endpoint }}"
        auth_token: "{{ bearer_token }}"
        validate_certs: false
        account_id: "{{ tenant_id }}"
        name: "{{ tenant_name }}"
        password: "{{ tenant_pass }}"
        update_password: "always"
        state: "present"
          #        name: "hr"
        allow_platform_services: false
        use_own_identity_source: false
        protocol: s3
      no_log: false  # to make sure the password is not logged
