---
- name: List StorageGRID load balancer endpoints
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    sg_api_url: "https://192.168.0.80:443"
    sg_username: "root"
    sg_password: "Netapp1!"
    validate_certs: false

  tasks:
    - name: Get auth token
      ansible.builtin.uri:
        url: "{{ sg_api_url }}/api/v4/authorize"
        method: POST
        validate_certs: "{{ validate_certs }}"
        body_format: json
        body:
          username: "{{ sg_username }}"
          password: "{{ sg_password }}"
        return_content: true
      register: auth_resp
      no_log: true   # hide credentials and token from output

    - name: Fail if authentication did not return a token
      ansible.builtin.fail:
        msg: "Authentication failed, no token returned from StorageGRID."
      when: auth_resp.json.data is not defined

    - name: Set auth token fact
      ansible.builtin.set_fact:
        sg_auth_token: "{{ auth_resp.json.data }}"

    - name: Get all load balancer endpoints
      ansible.builtin.uri:
        url: "{{ sg_api_url }}/api/v4/private/gateway-configs"
        method: GET
        validate_certs: "{{ validate_certs }}"
        headers:
          Authorization: "Bearer {{ sg_auth_token }}"
        return_content: true
      register: lb_resp

    - name: Show raw endpoint list (StorageGRID response)
      ansible.builtin.debug:
        var: lb_resp.json.data

    - name: Show concise endpoint table
      ansible.builtin.debug:
        msg: >-
          {{ item.id | default('N/A') }}
          | {{ item.displayName | default('N/A') }}
          | port={{ item.port | default('N/A') }}
          | secure={{ item.secure | default('N/A') }}
          | account={{ item.accountId | default('N/A') }}
      loop: "{{ lb_resp.json.data | default([]) | reject('equalto', None) | list }}"
      loop_control:
        label: "{{ item.displayName | default(item.id | default('endpoint')) }}"
