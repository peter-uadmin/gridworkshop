---
- name: List StorageGRID load balancer endpoints
  hosts: localhost
  connection: local
  gather_facts: false

# set variables needed.
  vars:
    sg_api_url: "https://192.168.4.230:443"   # e.g. https://sg-admin01.example.com
    sg_username: "root"
    sg_password: "Netapp1!"
    validate_certs: false

  tasks:
# authorize
    - name: Get auth token
      uri:
        url: "{{ sg_api_url }}/api/v4/authorize"
        method: POST
        validate_certs: "{{ validate_certs }}"
        body_format: json
        body:
          username: "{{ sg_username }}"
          password: "{{ sg_password }}"
        return_content: true
      register: auth_resp
# fill variable sg_auth_token  
    - name: Set auth token fact
      set_fact:
        sg_auth_token: "{{ auth_resp.json.data }}"

# use raw api and bearer token
    - name: Get all load balancer endpoints
      uri:
        url: "{{ sg_api_url }}/api/v4/private/gateway-configs"
        method: GET
        validate_certs: "{{ validate_certs }}"
        headers:
          Authorization: "Bearer {{ sg_auth_token }}"
        return_content: true
# store in lb_resp
      register: lb_resp

# store data section of lb_resp
    - name: Show raw endpoint list
      debug:
        var: lb_resp.json.data

# use debug, msg and jinja2 
# Show a compact, pipe-separated summary of each 
# load balancer endpoint (id, name, port, TLS, account)
    - name: Show concise endpoint table 
      debug:
        msg: >-
           {{ item.id | default('N/A') }}
           | {{ item.displayName | default('N/A') }}
           | port={{ item.port | default('N/A') }}
           | secure={{ item.secure | default('N/A') }}
           | account={{ item.accountId | default('N/A') }}
      loop: "{{ lb_resp.json.data | default([]) | reject('equalto', None) | list }}"
      loop_control:
        label: "{{ item.displayName | default(item.id | default('endpoint')) }}"
