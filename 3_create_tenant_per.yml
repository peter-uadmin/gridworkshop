---
- name: Create StorageGRID tenant and bucket
  hosts: localhost
  gather_facts: false

  collections:
    - netapp.storagegrid

  vars_prompt:
    - name: grid_addr
      prompt: "Grid admin address (e.g. 192.168.4.230)"
      default: "192.168.4.230"
      private: no
    - name: grid_user
      prompt: "Grid admin username"
      default: "root"
      private: no
    - name: grid_pass
      prompt: "Grid admin password"
      private: yes
    - name: tenant_name
      prompt: "Tenant name"
      private: no
    - name: tenant_password
      prompt: "Tenant root password"
      private: yes
    - name: bucket_name
      prompt: "Bucket name"
      private: no

  vars:
    api_url: "https://{{ grid_addr }}"
    validate_certs: false

  tasks:
    - name: Get grid admin token
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v3/authorize"
        method: POST
        body_format: json
        body:
          username: "{{ grid_user }}"
          password: "{{ grid_pass }}"
          cookie: false
          csrfToken: false
        headers:
          Content-Type: "application/json"
        validate_certs: "{{ validate_certs }}"
        status_code: 200
      register: grid_auth

    - name: Create tenant with bucket
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v4/grid/accounts"
        method: POST
        body_format: json
        body:
          name: "{{ tenant_name }}"
          description: "Email address: test@example.com"
          capabilities:
            - management
            - s3
          policy:
            useAccountIdentitySource: true
            allowPlatformServices: false
            allowSelectObjectContent: false
            quotaObjectBytes: 100000000000
          password: "{{ tenant_password }}"
          s3Bucket:
            enableVersioning: false
            name: "{{ bucket_name }}"
            region: "us-east-1"
            s3ObjectLock:
              enabled: false
        headers:
          Authorization: "Bearer {{ grid_auth.json.data }}"
          accept: "application/json"
          Content-Type: "application/json"
        validate_certs: "{{ validate_certs }}"
        status_code: 201
      register: tenant_result

    - name: Show tenant creation result
      ansible.builtin.debug:
        msg: |
          Tenant created successfully.
          Tenant name: {{ tenant_name }}
          Bucket name: {{ bucket_name }}
          Response: {{ tenant_result.json }}

