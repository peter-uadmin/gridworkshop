---
- name: Create pool
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - netapp.storagegrid

  vars_prompt:
    - name: grid_addr
      prompt: "Grid admin address"
      default: "192.168.0.80"
      private: false
    - name: grid_user
      prompt: "Grid admin username"
      default: "root"
      private: false
    - name: grid_pass
      prompt: "Grid admin password"
      private: true
    - name: pool_name
      prompt: "Name of pool"
      private: false
    - name: disk_count
      prompt: "number or disks"
      private: false

  tasks:
    - name: Get grid auth token
      ansible.builtin.uri:
        url: "https://{{ grid_addr }}/api/v3/authorize"
        method: POST
        body_format: json
        body:
          username: "{{ grid_user }}"
          password: "{{ grid_pass }}"
          cookie: false
          csrfToken: false
        headers:
          Content-Type: "application/json"
        validate_certs: false
        status_code: 200
      register: auth

    - name: Set grid token
      ansible.builtin.set_fact:
        grid_token: "{{ auth.json.data }}"

    - name: Display auth token
      ansible.builtin.debug:
        msg:
          - "Full auth response: {{ auth.json }}"
          - "Token data: {{ auth.json.data }}"
          - "Just the token: {{ auth.json.data }}"

    - name: Create ILM pool
      na_sg_grid_ilm_pool:
        api_url: "https://{{ grid_addr }}"
        auth_token: "{{ grid_token }}"
        name: "{{ pool_name }}"
        disks:
          - group: "{{ disk_count }}"
        archives: []
        validate_certs: false

