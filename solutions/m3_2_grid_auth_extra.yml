---
# this playbook uses ansible builtin modules like uri: and debug:
# builtin modules are called ansible.builtin.<modulename>
# but just the modulename is also accepted.
# the use of the netapp.storagegrid collection is not needed here.
- name: Get Grid Admin Auth Token
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
  # define endpoint, user and pass
  #
  vars_prompt:
    - name: grid_endpoint
      prompt: endpoint-url
      default: https://192.168.0.80 
      private: false
    - name: grid_username
      default: root
      private: false

        #  vars:
        #    grid_endpoint: "https://192.168.4.230:443"
        #    grid_username: "root"
  # connect to endpoint ans use /api/v3/authorize
  tasks:
    - name: Get Grid Authorization Token
      uri:
        url: "{{ grid_endpoint }}/api/v3/authorize"
        method: POST
        body: '{"username": "{{ grid_username }}",
                "password": "{{ grid_password }}"}'
        body_format: json
        validate_certs: false
        status_code: [200]
      register: auth
    # the authtoken can be processes as auth.json.data (variable)
    - name: Display Grid Admin Auth Token
      debug:
        msg: "Grid Admin Auth Token: {{ auth.json.data }}"
